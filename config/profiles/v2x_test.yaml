# CARLA Dataset Recording Configuration - Unified V2X Test
# Compatible with CARLA 0.9.16
#
# This configuration provides comprehensive V2X (Vehicle-to-Everything) testing,
# covering all communication scenarios in a single unified configuration.

# ============================================================================
# V2X Communication Test Scenarios
# ============================================================================
# This configuration tests all V2X communication combinations:
#
# 1. V2V (Vehicle-to-Vehicle):
#    - vehicle_01 <-> vehicle_02
#    - Both vehicles can send and receive V2X Custom messages
#    - Distance: ~20-30 meters (medium range)
#
# 2. V2I/I2V (Vehicle-Infrastructure-Vehicle):
#    - infrastructure_rsu -> vehicle_01, vehicle_02
#    - Infrastructure sends broadcast messages (one-way only)
#    - Distance: 10-40 meters (near to medium range)
#
# 3. Signal Strength Testing:
#    - Near distance: ~10m (strong signal, -40 to -50 dBm)
#    - Medium distance: ~30m (normal signal, -60 to -70 dBm)
#    - Tests wireless channel model with path loss simulation
#
# 4. V2X Custom Sensor Features:
#    - Manual message sending via send() API
#    - Custom JSON message format
#    - Real-time RSSI (Received Signal Strength Indicator)
# ============================================================================

# ============================================================================
# Recording Settings
# ============================================================================
recording:
  frame_total: 200            # Sufficient for comprehensive testing
  frame_step: 1               # Save every frame for detailed V2X analysis
  map: Town02                 # Compact urban environment
  weather: ClearNoon

# ============================================================================
# Spectator Camera Position
# ============================================================================
spectator:
  x: 100.0
  y: 190.0
  z: 50.0
  roll: 0.0
  pitch: -30.0
  yaw: -90.0

# ============================================================================
# World Physics Settings
# ============================================================================
world_settings:
  synchronous_mode: true
  fixed_delta_seconds: 0.1
  substepping: true
  max_substep_delta_time: 0.01
  max_substeps: 16

# ============================================================================
# Traffic Light Settings
# ============================================================================
traffic_lights:
  red_time: 2.0
  green_time: 2.0
  yellow_time: 0.01

# ============================================================================
# Sensor Configuration Templates
# ============================================================================
sensor_templates:
  # V2X Custom Sensor template (unified parameters)
  v2x_custom_template: &v2x_custom
    type: sensor.other.v2x_custom
    # Wireless channel parameters
    transmit_power: 30.0              # dBm - Enhanced transmission power
    receiver_sensitivity: -99.0       # dBm - Minimum receivable power
    frequency_ghz: 5.9                # GHz - ITS-G5 standard frequency
    filter_distance: 500              # meters - Maximum reception range
    # Path loss model (geometric with urban scenario)
    path_loss_model: geometric        # [geometric, winner]
    scenario: urban                   # [urban, rural, highway]
    combined_antenna_gain: 15.0       # dBi - Enhanced antenna gain
    d_ref: 1.0                        # Reference distance for path loss
    path_loss_exponent: 2.7           # Urban environment path loss exponent

  # RGB Camera template (simplified for reference)
  rgb_camera_template: &rgb_camera
    type: sensor.camera.rgb
    image_size_x: 400
    image_size_y: 300
    fov: 90.0

# ============================================================================
# Vehicle and Sensor Actors
# ============================================================================
actors:
  # ========================================================================
  # V2V Test: Vehicle 1 (Primary)
  # ========================================================================
  - type: vehicle.tesla.model3
    name: vehicle_01
    spawn_point: 60               # Location: (92, 188)
    sensors:
      # V2X Custom sensor (V2V + V2I receiver)
      - <<: *v2x_custom
        name: v2x_custom
        spawn_point: {x: 0.0, y: 0.0, z: 2.0, roll: 0.0, pitch: 0.0, yaw: 0.0}

      # RGB camera for visual reference
      - <<: *rgb_camera
        name: rgb_front
        spawn_point: {x: 2.0, y: 0.0, z: 1.5, roll: 0.0, pitch: 0.0, yaw: 0.0}

  # ========================================================================
  # V2V Test: Vehicle 2 (Secondary)
  # ========================================================================
  - type: vehicle.audi.a2
    name: vehicle_02
    spawn_point: 76               # Near spawn_point 60 (~20-30m)
    sensors:
      # V2X Custom sensor (V2V + V2I receiver)
      - <<: *v2x_custom
        name: v2x_custom
        spawn_point: {x: 0.0, y: 0.0, z: 2.0, roll: 0.0, pitch: 0.0, yaw: 0.0}

      # RGB camera for visual reference
      - <<: *rgb_camera
        name: rgb_front
        spawn_point: {x: 2.0, y: 0.0, z: 1.5, roll: 0.0, pitch: 0.0, yaw: 0.0}

  # ========================================================================
  # V2I/I2V Test: Infrastructure (Road Side Unit)
  # ========================================================================
  # IMPORTANT: Infrastructure V2X Limitations
  # - Infrastructure ONLY supports 'sensor.other.v2x_custom' (NOT 'sensor.other.v2x')
  # - V2X Custom on Infrastructure is ONE-WAY communication (broadcast only)
  # - Infrastructure can send messages but CANNOT receive messages
  # - For bi-directional V2X communication, use Vehicle actors instead
  #
  # Technical Reason: V2X CAM sensors require vehicle dynamics data
  #                   (speed, acceleration, yaw rate) which static
  #                   Infrastructure cannot provide.
  # ========================================================================
  - type: infrastructure
    name: infrastructure_rsu
    spawn_point: {x: 90.0, y: 180.0, z: 5.0}  # Near vehicle spawn points
    sensors:
      # V2X Custom sensor (broadcast only, no reception)
      - <<: *v2x_custom
        name: v2x_custom
        spawn_point: {x: 0.0, y: 0.0, z: 2.0, roll: 0.0, pitch: 0.0, yaw: 0.0}

# ============================================================================
# Background Traffic Vehicles
# ============================================================================
# Purpose: Add realism to the test environment without overwhelming V2X analysis
# Note: Background vehicles do not have V2X sensors in this test configuration
# ============================================================================
other_vehicles:
  count: 5
  spawn_points:
    - 44
    - 55
    - 64
    - 39
    - 58

# ============================================================================
# Test Validation Checklist
# ============================================================================
# After recording, verify the following in the output data:
#
# 1. V2V Communication:
#    □ vehicle_01/v2x_custom/ contains messages from vehicle_02
#    □ vehicle_02/v2x_custom/ contains messages from vehicle_01
#    □ Message format: {"type": "VEHICLE", "name": "vehicle_XX", "location": {...}}
#    □ RSSI values are reasonable (~-40 to -60 dBm for 20-30m distance)
#
# 2. V2I Communication:
#    □ vehicle_01/v2x_custom/ contains messages from infrastructure_rsu
#    □ vehicle_02/v2x_custom/ contains messages from infrastructure_rsu
#    □ Message format: {"type": "RSU", "name": "infrastructure_rsu", "location": {...}}
#    □ RSSI values vary based on distance (vehicle_01 stronger than vehicle_02)
#
# 3. Infrastructure Behavior:
#    □ infrastructure_rsu directory exists but has no V2X reception data
#    □ Vehicles successfully receive Infrastructure broadcast messages
#    □ Infrastructure sends messages every control step (check logs)
#
# 4. Signal Strength:
#    □ Closer vehicles have stronger signals (higher RSSI)
#    □ RSSI decreases with distance following path loss model
#    □ All received messages have RSSI above sensitivity threshold (-99 dBm)
# ============================================================================
