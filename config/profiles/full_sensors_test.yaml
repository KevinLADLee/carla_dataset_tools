# CARLA Dataset Tools - Full Sensors Test Configuration
# This configuration includes all supported sensor types for comprehensive testing

recording:
  map: "Town03"
  weather: "ClearNoon"
  frame_total: 100
  frame_step: 1

world_settings:
  synchronous_mode: true
  fixed_delta_seconds: 0.1
  substepping: true
  max_substep_delta_time: 0.01
  max_substeps: 10
  vehicle_stabilization:
    init_tick_num: 5

spectator:
  x: 5.0
  y: 0.0
  z: 15.0
  roll: 0.0
  pitch: -45.0
  yaw: 0.0

traffic_lights:
  red_time: 30.0
  green_time: 30.0
  yellow_time: 3.0

actors:
  - type: "vehicle.tesla.model3"
    name: "ego_vehicle"
    spawn_point: 0
    sensors:
      # RGB Camera - Standard
      - type: "sensor.camera.rgb"
        name: "camera_rgb"
        attributes:
          image_size_x: 1920
          image_size_y: 1080
          fov: 90.0
          sensor_tick: 0.0
        spawn_point:
          x: 1.5
          y: 0.0
          z: 2.4
          roll: 0.0
          pitch: 0.0
          yaw: 0.0

      # Semantic Segmentation Camera
      - type: "sensor.camera.semantic_segmentation"
        name: "camera_semantic"
        attributes:
          image_size_x: 1920
          image_size_y: 1080
          fov: 90.0
          sensor_tick: 0.0
        spawn_point:
          x: 1.5
          y: 0.0
          z: 2.4
          roll: 0.0
          pitch: 0.0
          yaw: 0.0

      # Instance Segmentation Camera
      - type: "sensor.camera.instance_segmentation"
        name: "camera_instance"
        attributes:
          image_size_x: 1920
          image_size_y: 1080
          fov: 90.0
          sensor_tick: 0.0
        spawn_point:
          x: 1.5
          y: 0.0
          z: 2.4
          roll: 0.0
          pitch: 0.0
          yaw: 0.0

      # Depth Camera
      - type: "sensor.camera.depth"
        name: "camera_depth"
        attributes:
          image_size_x: 1920
          image_size_y: 1080
          fov: 90.0
          sensor_tick: 0.0
        spawn_point:
          x: 1.5
          y: 0.0
          z: 2.4
          roll: 0.0
          pitch: 0.0
          yaw: 0.0

      # DVS Event Camera
      - type: "sensor.camera.dvs"
        name: "camera_dvs"
        attributes:
          image_size_x: 1920
          image_size_y: 1080
          fov: 90.0
          sensor_tick: 0.0
          positive_threshold: 0.1      
          negative_threshold: 0.2     
          sigma_positive_threshold: 0.03  
          refractory_period_ns: 1000000  
          use_log: true                
          log_eps: 0.001               
        spawn_point:
          x: 1.5
          y: 0.0
          z: 2.4
          roll: 0.0
          pitch: 0.0
          yaw: 0.0

      # IMU Sensor
      - type: "sensor.other.imu"
        name: "imu_main"
        attributes:
          sensor_tick: 0.01
          noise_accel_stddev_x: 0.1
          noise_accel_stddev_y: 0.1
          noise_accel_stddev_z: 0.1
          noise_gyro_stddev_x: 0.01
          noise_gyro_stddev_y: 0.01
          noise_gyro_stddev_z: 0.01
          noise_seed: 12345
        spawn_point:
          x: 0.0
          y: 0.0
          z: 1.0
          roll: 0.0
          pitch: 0.0
          yaw: 0.0

      # GNSS Sensor
      - type: "sensor.other.gnss"
        name: "gnss_main"
        attributes:
          sensor_tick: 0.1
          noise_lat_stddev: 0.0001
          noise_lon_stddev: 0.0001
          noise_alt_stddev: 0.1
          noise_seed: 54321
        spawn_point:
          x: 0.0
          y: 0.0
          z: 2.0
          roll: 0.0
          pitch: 0.0
          yaw: 0.0

      # Optical Flow Camera
      - type: "sensor.camera.optical_flow"
        name: "camera_optical_flow"
        attributes:
          image_size_x: 1920
          image_size_y: 1080
          fov: 90.0
          sensor_tick: 0.0
        spawn_point:
          x: 1.5
          y: 0.0
          z: 2.2
          roll: 0.0
          pitch: 0.0
          yaw: 0.0

      # LiDAR Ray Cast
      - type: "sensor.lidar.ray_cast"
        name: "lidar_main"
        attributes:
          channels: 64
          range: 100.0
          points_per_second: 1300000
          rotation_frequency: 10.0
          upper_fov: 10.0
          lower_fov: -30.0
          sensor_tick: 0.0
          atmosphere_attenuation_rate: 0.004
          dropoff_general_rate: 0.45
          dropoff_intensity_limit: 0.8
          noise_stddev: 0.01
        spawn_point:
          x: 0.0
          y: 0.0
          z: 2.4
          roll: 0.0
          pitch: 0.0
          yaw: 0.0

      # Semantic LiDAR
      - type: "sensor.lidar.ray_cast_semantic"
        name: "lidar_semantic"
        attributes:
          channels: 64
          range: 100.0
          points_per_second: 1300000
          rotation_frequency: 10.0
          upper_fov: 10.0
          lower_fov: -30.0
          sensor_tick: 0.0
        spawn_point:
          x: 0.0
          y: 0.0
          z: 2.4
          roll: 0.0
          pitch: 0.0
          yaw: 0.0

      # Radar Sensor
      - type: "sensor.other.radar"
        name: "radar_front"
        attributes:
          horizontal_fov: 30.0
          vertical_fov: 30.0
          points_per_second: 1500
          range: 100.0
          sensor_tick: 0.0
        spawn_point:
          x: 2.5
          y: 0.0
          z: 1.0
          roll: 0.0
          pitch: 0.0
          yaw: 0.0

      # Additional RGB Camera (Wide angle)
      - type: "sensor.camera.rgb"
        name: "camera_wide"
        attributes:
          image_size_x: 1920
          image_size_y: 1080
          fov: 120.0
          sensor_tick: 0.0
        spawn_point:
          x: 1.5
          y: 0.0
          z: 2.2
          roll: 0.0
          pitch: -10.0
          yaw: 0.0

# Background vehicles for traffic simulation
other_vehicles:
  count: 50
  # Optional: specify specific spawn points (indices from map spawn points)
  # spawn_points: [1, 2, 3, 5, 8, 12, 15, 18, 20, 25]