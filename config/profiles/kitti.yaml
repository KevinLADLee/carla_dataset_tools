# CARLA Dataset Recording Configuration - KITTI Style
# Compatible with CARLA 0.9.16
# Configured for KITTI-style autonomous driving dataset generation

# ============================================================================
# Recording Settings - 录制设置
# ============================================================================
recording:
  frame_total: 12000        # Total frames to record - 总帧数
  frame_step: 2             # Save every 3rd frame - 每3帧保存
  map: Town02                # CARLA map
  weather: ClearNoon        # Weather preset (optional): ClearNoon, CloudyNoon, WetNoon, HardRainNoon, etc.

# ============================================================================
# Spectator Camera Position - 观察者相机位置
# ============================================================================
spectator:
  x: 100.0
  y: -150.0
  z: 150.0
  roll: 0.0
  pitch: 60.0
  yaw: -90.0

# ============================================================================
# World Physics Settings - 世界物理设置
# ============================================================================
world_settings:
  synchronous_mode: true
  fixed_delta_seconds: 0.1
  substepping: true
  max_substep_delta_time: 0.005
  max_substeps: 20

  # Vehicle stabilization settings - 车辆稳定设置
  # After spawning, wait for vehicles to settle on ground before enabling autopilot
  vehicle_stabilization:
    init_tick_num: 5  

# ============================================================================
# Traffic Light Settings - 交通灯设置
# ============================================================================
traffic_lights:
  red_time: 2.0
  green_time: 2.0
  yellow_time: 0.01

# ============================================================================
# KITTI Sensor Templates - KITTI传感器模板
# ============================================================================
sensor_templates:
  # KITTI RGB Camera (image_2) - KITTI RGB相机
  kitti_camera: &kitti_camera
    type: sensor.camera.rgb
    image_size_x: 1382        # KITTI standard resolution - KITTI标准分辨率
    image_size_y: 512
    fov: 90.0

  # KITTI Semantic Segmentation Camera - KITTI语义分割相机
  kitti_semantic: &kitti_semantic
    type: sensor.camera.semantic_segmentation
    image_size_x: 1382
    image_size_y: 512
    fov: 90.0

  # Velodyne HDL-64E LiDAR (KITTI standard) - Velodyne HDL-64E激光雷达
  velodyne_64: &velodyne_64
    type: sensor.lidar.ray_cast
    range: 100                # 100m range - 100米范围
    channels: 64              # 64 channels - 64线
    points_per_second: 1300000  # ~1.3M points/sec - 每秒约130万个点
    upper_fov: 2.0            # +2° upper FOV - 上视场角+2度
    lower_fov: -24.8          # -24.8° lower FOV - 下视场角-24.8度
    rotation_frequency: 10    # 10 Hz rotation - 10Hz旋转
    noise_stddev: 0.02        # Slight noise for realism - 轻微噪声增加真实感

  # Semantic LiDAR for ground truth - 语义激光雷达用于真值标签
  velodyne_semantic: &velodyne_semantic
    type: sensor.lidar.ray_cast_semantic
    range: 100
    channels: 64
    points_per_second: 1300000
    upper_fov: 2.0
    lower_fov: -24.8
    rotation_frequency: 10

# ============================================================================
# Ego Vehicles with KITTI Sensors - 装配KITTI传感器的自车
# ============================================================================
actors:
  # Primary ego vehicle - 主要自车
  - type: vehicle.tesla.model3
    name: vehicle_1st
    spawn_point: 73
    sensors:
      # RGB Camera (image_2) - RGB相机
      - <<: *kitti_camera
        name: image_2
        spawn_point:
          x: 2.0
          y: 0.0
          z: 2.0              # KITTI camera height - KITTI相机高度
          roll: 0.0
          pitch: 0.0
          yaw: 0.0

      # Semantic Segmentation Camera - 语义分割相机
      - <<: *kitti_semantic
        name: image_2_semantic
        spawn_point:
          x: 2.0
          y: 0.0
          z: 2.0
          roll: 0.0
          pitch: 0.0
          yaw: 0.0

      # Velodyne LiDAR - 激光雷达
      - <<: *velodyne_64
        name: velodyne
        spawn_point:
          x: 0.0
          y: 0.0
          z: 2.4              # LiDAR height - 激光雷达高度
          roll: 0.0
          pitch: 0.0
          yaw: 0.0

      # Semantic LiDAR for labels - 语义激光雷达
      - <<: *velodyne_semantic
        name: velodyne_semantic
        spawn_point:
          x: 0.0
          y: 0.0
          z: 2.4
          roll: 0.0
          pitch: 0.0
          yaw: 0.0

  # Secondary ego vehicle - 第二辆自车
  - type: vehicle.tesla.model3
    name: vehicle_2nd
    spawn_point: 76
    sensors:
      - <<: *kitti_camera
        name: image_2
        spawn_point: {x: 2.0, y: 0.0, z: 2.0, roll: 0.0, pitch: 0.0, yaw: 0.0}

      - <<: *velodyne_64
        name: velodyne
        spawn_point: {x: 0.0, y: 0.0, z: 2.4, roll: 0.0, pitch: 0.0, yaw: 0.0}

  # Infrastructure sensor (roadside unit) - 路侧单元
  - type: infrastructure
    name: tl_infra_01
    spawn_point:
      x: 40
      y: -240
      z: 4.0
    sensors:
      - <<: *kitti_camera
        name: infra_camera
        spawn_point: {x: 0.0, y: 0.0, z: 0.0, roll: 0.0, pitch: 0.0, yaw: 0.0}

# ============================================================================
# Background Traffic - 背景交通
# ============================================================================
other_vehicles:
  count: 200                   # 10 random vehicles - KITTI uses controlled scenarios
  spawn_points: []            # Specific vehicles defined in actors section
